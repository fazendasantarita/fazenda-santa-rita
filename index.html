<!DOCTYPE html>
<html lang="pt-BR">
<head>
  
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#008259">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Santa Rita">
  <!-- iOS: apple-touch-icon SEM cache-buster para forçar reload -->
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="apple-touch-icon" sizes="120x120" href="icon-128.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <meta name="msapplication-TileImage" content="icon-144.png">
  <meta name="msapplication-TileColor" content="#ffffff">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Santa Rita — Login</title>
  <script src="config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    background: #f5f0eb;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: white;
    border-radius: 20px;
    padding: 48px 44px;
    width: 380px;
    max-width: calc(100vw - 32px);
    box-shadow: 0 8px 48px rgba(0,0,0,0.12);
    text-align: center;
  }
  .card img { width: 170px; margin-bottom: 32px; }
  .label {
    display: block; text-align: left;
    font-size: 10px; font-weight: 700;
    letter-spacing: .14em; text-transform: uppercase;
    color: #888; margin-bottom: 6px;
    font-family: 'DM Mono', monospace;
  }
  .inp {
    width: 100%; padding: 12px 16px;
    border: 1.5px solid #e0e0e0;
    border-radius: 10px; font-size: 15px;
    color: #1a3a2a; outline: none;
    font-family: 'Syne', sans-serif;
    transition: border-color .2s;
    margin-bottom: 14px;
  }
  .inp:focus { border-color: #4a7c2f; box-shadow: 0 0 0 3px rgba(74,124,47,.1); }
  .btn {
    width: 100%; padding: 14px;
    background: #4a7c2f; color: white;
    border: none; border-radius: 10px;
    font-size: 15px; font-weight: 700;
    font-family: 'Syne', sans-serif;
    cursor: pointer; margin-top: 4px;
    transition: background .2s;
    letter-spacing: .04em;
  }
  .btn:hover { background: #3d6b25; }
  .err { 
    color: #c0392b; font-size: 12px; 
    margin-top: 12px; min-height: 18px;
    font-family: 'DM Mono', monospace;
  }
  .aviso { background:#fff7e0; border:1px solid #e8c96a; color:#6b5200; border-radius:10px; padding:12px 14px; font-size:13px; margin-bottom:18px; line-height:1.45; font-family:'DM Mono',monospace; }
  .footer { margin-top: 32px; font-size: 10px; color: #ccc; font-family: 'DM Mono', monospace; }
</style>

</head>
<body>
  <div class="card">
    <img src="logo.png" alt="Fazenda Santa Rita">
    <div id="box-login">
      <label class="label" for="u">Usuário</label>
      <input class="inp" type="text" id="u" placeholder="seu usuario" autocomplete="username" autocapitalize="off"
        onkeydown="if(event.key==='Enter')document.getElementById('p').focus()">
      <label class="label" for="p">Senha</label>
      <input class="inp" type="password" id="p" placeholder="••••••••" autocomplete="current-password"
        onkeydown="if(event.key==='Enter')login()">
      <button class="btn" onclick="login()">Entrar</button>
    </div>
    <div id="box-troca" style="display:none;">
      <div class="aviso">Primeiro acesso de <b id="troca-nome"></b>.<br>Crie uma senha pessoal para continuar.</div>
      <label class="label" for="n1">Nova senha</label>
      <input class="inp" type="password" id="n1" placeholder="mínimo 6 caracteres" autocomplete="new-password"
        onkeydown="if(event.key==='Enter')document.getElementById('n2').focus()">
      <label class="label" for="n2">Confirmar nova senha</label>
      <input class="inp" type="password" id="n2" placeholder="repita a senha" autocomplete="new-password"
        onkeydown="if(event.key==='Enter')salvarNovaSenha()">
      <button class="btn" onclick="salvarNovaSenha()">Salvar e entrar</button>
    </div>
    <div class="err" id="err"></div>
    <div class="footer">Fazenda Santa Rita &copy; 2026</div>
  </div>
  <script>
    // Usuários e senhas iniciais vêm do config.js (APP_CONFIG.USUARIOS).
    // Senhas trocadas ficam em localStorage ('gf_users_v2'), mesmo formato usado pelo app-config.
    var DEF = (window.APP_CONFIG && window.APP_CONFIG.USUARIOS) || {};
    var pendente = null;

    function lerUsers() {
      try { return JSON.parse(localStorage.getItem('gf_users_v2') || '{}') || {}; } catch(e) { return {}; }
    }
    function erro(msg) {
      var err = document.getElementById('err');
      err.textContent = msg;
      setTimeout(function(){ if(err.textContent === msg) err.textContent=''; }, 3500);
    }
    function entrar(login, role) {
      var nome = login.charAt(0).toUpperCase() + login.slice(1);
      sessionStorage.setItem('gf_user', nome);
      sessionStorage.setItem('gf_role', role);
      window.location.href = 'app.html';
    }

    function login() {
      var u = (document.getElementById('u').value||'').trim().toLowerCase();
      var p = document.getElementById('p').value||'';
      var st = lerUsers()[u], def = DEF[u];
      if(!st && !def) { document.getElementById('p').value=''; return erro('Usuário ou senha incorretos'); }
      if(st && st.ativo === false) return erro('Usuário desativado');
      var senha = (st && st.senha) || (def && def.senha);
      var role  = (st && st.role)  || (def && def.perfil) || 'funcionario';
      if(!senha || p !== senha) {
        document.getElementById('p').value=''; document.getElementById('p').focus();
        return erro('Usuário ou senha incorretos');
      }
      // Ainda usando a senha inicial do config.js → obriga a troca
      if(def && def.senha && p === def.senha) {
        pendente = { login:u, role:role, inicial:def.senha, nome:(def.nome||u) };
        document.getElementById('box-login').style.display='none';
        document.getElementById('box-troca').style.display='';
        document.getElementById('troca-nome').textContent = pendente.nome;
        document.getElementById('n1').focus();
        return;
      }
      entrar(u, role);
    }

    function salvarNovaSenha() {
      if(!pendente) return;
      var a = document.getElementById('n1').value||'', b = document.getElementById('n2').value||'';
      if(a.length < 6)            return erro('A senha precisa ter pelo menos 6 caracteres');
      if(a !== b)                 return erro('As senhas não conferem');
      if(a === pendente.inicial)  return erro('A nova senha deve ser diferente da inicial');
      var users = lerUsers();
      var reg = users[pendente.login] || {};
      users[pendente.login] = {
        login: pendente.login,
        nome:  reg.nome || pendente.nome,
        senha: a,
        role:  reg.role || pendente.role,
        ativo: reg.ativo !== false,
        perms: reg.perms || {}
      };
      localStorage.setItem('gf_users_v2', JSON.stringify(users));
      entrar(pendente.login, users[pendente.login].role);
    }

    if(sessionStorage.getItem('gf_user')) window.location.href='app.html';
    document.getElementById('u').focus();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js')
          .then(function(reg) { console.log('SW registrado:', reg.scope); })
          .catch(function(err) { console.warn('SW erro:', err); });
      });
    }
  </script>
</body>
</html>
